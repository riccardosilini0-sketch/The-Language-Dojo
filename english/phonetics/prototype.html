<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Audio prototype · Sounds of English · Language Dojo</title>
<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700;800&family=Gentium+Book+Plus:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/dojo.css">
<link rel="stylesheet" href="../../assets/css/resource.css">
<link rel="stylesheet" href="app.css">
<style>
  .proto{padding:36px 0 70px}
  .proto h2{font-size:clamp(26px,3.4vw,34px);margin:34px 0 6px}
  .proto .lead{margin:0 0 16px;color:var(--stone);font-size:15.5px;max-width:760px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .pcard{padding:18px;display:flex;flex-direction:column;gap:8px}
  .pcard .sym{font-size:46px;line-height:1;color:var(--app)}
  .pcard .kw{font-size:14px;color:var(--stone)}
  .pcard .note{font-size:13px;color:var(--sumi-2);line-height:1.45}
  .pcard .src{font-size:12px;color:var(--stone)} .pcard .src a{color:var(--app)}
  .plays{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--sumi)}
  .pbtn svg{width:15px;height:15px;color:var(--app)}
  .pbtn:hover{border-color:var(--app)}
  .pbtn.ga svg{color:var(--teal)}
  .pbtn.playing{background:var(--app-bg);border-color:var(--app)}
  .wrow{display:grid;grid-template-columns:140px 1fr 1fr;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--line-2)}
  .wrow:first-child{border-top:0}
  .wrow b{font:700 20px/1.2 var(--serif)}
  .wrow .acc{display:flex;flex-direction:column;gap:6px}
  .wrow .acc small{font-size:12px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:.08em}
  .prow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:16px 18px;border-top:1px solid var(--line-2)}
  .prow:first-child{border-top:0}
  .prow .side{display:flex;flex-direction:column;gap:6px}
  .prow .side b{font:700 22px/1.2 var(--serif)}
  .prow .mid{text-align:center;font-size:13px;color:var(--stone)}
  .ipa-sm{font-size:18px;color:var(--sumi-2)}
  .warn{background:var(--kincha-bg);border:1px solid #e6cf9f;border-radius:14px;padding:14px 18px;margin:16px 0;font-size:15px}
  @media (max-width:720px){ .wrow{grid-template-columns:1fr} .prow{grid-template-columns:1fr} .prow .mid{text-align:left} }
</style>
</head>
<body data-root="../../" data-page="english">
<header id="site-header"></header>
<main>
  <section class="app-hero">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="../../index.html">Home</a><span aria-hidden="true">/</span><a href="../index.html">English</a><span aria-hidden="true">/</span><a href="index.html">Sounds of English</a><span aria-hidden="true">/</span><span>Audio prototype</span></nav>
      <div class="app-title"><span class="app-badge" id="appBadge" aria-hidden="true"></span><div><h1>Audio prototype</h1></div></div>
    </div>
  </section>
  <div class="wrap proto" id="proto"></div>
</main>
<footer id="site-footer"></footer>
<script src="../../assets/js/brand.js"></script>
<script src="../../assets/js/catalog.js"></script>
<script src="../../assets/js/site.js"></script>
<script src="data/audio-proto.js"></script>
<script>
(function () {
  "use strict";
  const { esc } = window.Dojo, M = window.PHON_AUDIO_PROTO, root = document.getElementById("proto");
  const icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
  const ipa = s => `<span class="ipa ipa-sm">${esc(s)}</span>`;
  const btn = (files, label, cls) => `<button class="pbtn ${cls || ""}" type="button" data-files="${esc(files.join(","))}">${icon}${esc(label)}</button>`;
  if (!M) { root.innerHTML = `<div class="warn">The audio has not been generated yet. It appears here automatically once the GitHub Action “Audio” has run.</div>`; return; }
  const takes = (files, prefix, cls) => files.map((f, i) => btn([f], files.length > 1 ? `${prefix} ${String.fromCharCode(65 + i)}` : prefix, cls)).join("");
  root.innerHTML = `
    ${M.problems && M.problems.length ? `<div class="warn"><b>Notes from the generator</b><ul>${M.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>` : ""}
    <p class="lead">${esc(M.provider || "")} · British voice: <b>${esc((M.voices.bre || {}).name || "—")}</b> · American voice: <b>${esc((M.voices.ga || {}).name || "—")}</b> · generated ${esc(M.generated)}.</p>
    ${M.phonemes.length ? `<h2>Phonemes</h2>
    <p class="lead">Authentic recordings of the IPA sounds from Wikimedia Commons (the sound files used by Wikipedia’s IPA articles). The note under each symbol says how close the recording is to the SSBE phoneme.</p>
    <div class="pgrid">${M.phonemes.map(p => `<div class="card pcard"><span class="ipa sym">/${esc(p.ipa)}/</span><span class="kw">${esc(p.kind)} · as in ${esc(p.keyword)}</span>
      <div class="plays">${btn([p.file], "Play")}</div><p class="note">${esc(p.match)}</p>
      <p class="src">Recording: ${esc(p.source.author)} · <a href="${esc(p.source.page)}" target="_blank" rel="noopener">${esc(p.source.licence)}</a></p></div>`).join("")}</div>` : ""}
    <h2>Words: British and American</h2>
    <div class="card">${M.words.map(w => `<div class="wrow"><b>${esc(w.text)}</b>
      <div class="acc"><small>BrE (SSBE) ${ipa(w.bre)}</small><div class="plays">${takes(w.files.bre || [], "British")}</div></div>
      <div class="acc"><small>GA ${ipa(w.ga)}</small><div class="plays">${takes(w.files.ga || [], "American", "ga")}</div></div></div>`).join("") || `<div class="wrow">Not generated yet.</div>`}</div>
    <h2>Minimal pairs</h2>
    <div class="card">${M.pairs.map(p => `<div class="prow">
      <div class="side"><b>${esc(p.a.text)}</b>${ipa(p.a.bre)}<div class="plays">${takes(p.a.files, "Play")}</div></div>
      <div class="mid">${ipa(p.contrast)}<br>${btn([p.a.files[0], p.b.files[0]], "Play both")}</div>
      <div class="side"><b>${esc(p.b.text)}</b>${ipa(p.b.bre)}<div class="plays">${takes(p.b.files, "Play")}</div></div></div>`).join("") || `<div class="prow">Not generated yet.</div>`}</div>`;
  let audio = null, queue = [];
  function playNext(btnEl) {
    const f = queue.shift(); if (!f) { btnEl.classList.remove("playing"); return; }
    audio = new Audio("audio/proto/" + f); audio.onended = () => setTimeout(() => playNext(btnEl), 450); audio.play().catch(() => btnEl.classList.remove("playing"));
  }
  root.addEventListener("click", e => {
    const b = e.target.closest(".pbtn"); if (!b) return;
    if (audio) audio.pause(); document.querySelectorAll(".pbtn.playing").forEach(x => x.classList.remove("playing"));
    queue = b.dataset.files.split(","); b.classList.add("playing"); playNext(b);
  });
})();
</script>
</body>
</html>
