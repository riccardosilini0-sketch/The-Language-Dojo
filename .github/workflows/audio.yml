name: Audio

# Generates all site audio with Azure AI Speech and commits the MP3 files (Netlify then publishes).
# Runs when the content or the audio tools change, or by hand (Actions → Audio → Run workflow).
# Key and region come from the repository secrets AZURE_SPEECH_KEY and AZURE_SPEECH_REGION;
# they are never written into the site.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/audio/**"
      - "english/phonetics/data/vowels.js"
      - "english/phonetics/data/diphthongs.js"
      - "english/phonetics/data/consonants.js"
      - "english/phonetics/data/lessons.js"
      - "english/phonetics/data/exercises.js"
      - "english/irregular-verbs/verbs-data.js"
      - "english/skills/data/reading.js"
      - "english/skills/data/listening.js"

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then echo "::error::Repository secret AZURE_SPEECH_KEY is missing"; exit 1; fi
          if [ -z "$AZURE_SPEECH_REGION" ]; then echo "::error::Repository secret AZURE_SPEECH_REGION is missing"; exit 1; fi
          echo "Secrets found (region length ${#AZURE_SPEECH_REGION})."
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build job list
        run: node tools/audio/build_jobs.js
      - name: Generate audio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: python3 tools/audio/generate.py
      - name: Commit audio
        run: |
          git config user.name "Language Dojo audio bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A english/phonetics/audio english/phonetics/data/audio.js english/irregular-verbs/audio english/irregular-verbs/audio-data.js english/skills/audio english/skills/data/audio.js tools/audio/jobs.json
          git diff --cached --quiet || (git commit -m "Audio: regenerate with Azure neural voices" && git pull --rebase origin main && git push)
